<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d95f45" />
  <title>かわりばんこ — 開発チームの交換日記</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero" aria-labelledby="diary-title">
      <p class="eyebrow">DEVELOPMENT TEAM · SHARED DIARY</p>
      <h1 id="diary-title">かわりばんこ</h1>
      <p id="diary-subtitle" class="subtitle">日記を開いています…</p>
      <div id="member-list" class="members" aria-label="この日記の書き手"></div>
    </header>

    <section class="toolbar" aria-label="日記の表示設定">
      <div>
        <p class="section-label">読む</p>
        <h2>みんなのページ</h2>
      </div>
      <div id="filters" class="filters" aria-label="書き手で絞り込む"></div>
    </section>

    <section aria-live="polite" aria-busy="true">
      <p id="status" class="status">日記を読み込んでいます…</p>
      <ol id="entries" class="entries" aria-label="日記のエントリ"></ol>
    </section>

    <template id="entry-template">
      <li class="entry">
        <article>
          <div class="entry-marker" aria-hidden="true"></div>
          <div class="entry-content">
            <header class="entry-header">
              <p class="entry-meta"></p>
              <p class="entry-date"></p>
            </header>
            <p class="entry-mood" aria-label="今日の気分"></p>
            <h3></h3>
            <div class="entry-body"></div>
            <p class="reply-note" hidden></p>
          </div>
        </article>
      </li>
    </template>

    <noscript><p class="status error">この日記を読むには JavaScript を有効にしてください。</p></noscript>
  </main>
  <script src="app.js"></script>
</body>
</html>
